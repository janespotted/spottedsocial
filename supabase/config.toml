# Mux video: the phone asks mux-create-upload (signed-in user) for a direct
# upload URL; Mux calls mux-webhook (no Supabase JWT — verified by the
# Mux-Signature header against MUX_WEBHOOK_SECRET) when the asset is ready.
[functions.mux-create-upload]
verify_jwt = true

[functions.mux-webhook]
verify_jwt = false
# Drains mux_asset_deletions (assets of deleted posts); invoked by pg_cron via
# pg_net, so no JWT — it can only delete assets already queued for removal.
[functions.mux-cleanup]
verify_jwt = false

